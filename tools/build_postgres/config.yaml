tools:
  build_postgres:
    signature: "build_postgres <source_code_path>"
    docstring: "Build postgres from source code at the specified path. Returns the path to the generated executable."
    arguments:
      - name: source_code_path
        type: string
        description: "Path to the postgres source code directory to build from."
        required: true
state_command: "_state_build_postgres"
